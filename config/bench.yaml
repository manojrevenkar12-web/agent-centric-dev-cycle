# The benchmark: real fixes from n8n's history, replayed as tasks for coding agents (packages/bench).
package: packages/workflow
# sparse checkout of a task: the package and the workspace packages its tests resolve through node_modules
sparse: [packages/workflow, patches]
# vitest projects come from each checkout's own config; the isolated-vm engine needs a native module
# the sandbox does not build, so it is skipped.
skip_projects: [vm-engine]
# Installed dependency trees by era: a task runs on the newest one installed at or before its commit.
# "" is the main checkout (N8N_REPO). Others are worktrees of n8n at an older commit with
# `pnpm install --filter "n8n-workflow..."` and the workspace dependencies built.
envs:
  - { from: "2025-11-01", dir: /home/claude/acdc-env/2026-07 }
  - { from: "2026-09-01", dir: "" }
work_dir: /home/claude/acdc-work
test_timeout_s: 600
network_isolation: true        # tests run in a new user and network namespace (unshare)

mining:
  since: "2025-11-01"          # validation drops tasks whose old code no longer fits today's installed dependencies
  max_source_files: 4
  max_source_lines: 150        # changed lines in source files; larger fixes are features in disguise
  require_tests_in: packages/workflow/test/
  limit: 60                    # candidates to validate, newest first

# A task's grade
grade:
  related_tests: true          # also run the package's test files that import a changed module
  typecheck: true
  lint: true

# Who runs. Each setup runs every task once; results in reports/runs/<setup>/ are first attempts.
run:
  setups:
    - { name: sonnet-repo, model: sonnet, context: repo }   # with n8n's AGENTS.md and CLAUDE.md
    - { name: sonnet-bare, model: sonnet, context: bare }   # the same checkout without them
    - { name: haiku-repo,  model: haiku,  context: repo }
    - { name: opus-repo,   model: opus,   context: repo }
  budget_per_run_usd: 3.00
  total_cap_usd: 80
  timeout_s: 1500
  concurrency: 2                 # sessions at a time (each runs vitest; the box has 2 cores)

# The judge reads each change next to the fix n8n merged (packages/bench/src/judge.ts). Its verdicts are
# reported beside the hidden tests, never instead of them.
judge:
  model: sonnet
  budget_usd: 0.40
